<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../../styles/style.css">

    <title>Cart — Furniro</title>
</head>

<body class="bg-white">

    <header id="navbar-root" class="sticky top-0 z-50">
    </header>

    <section class="page-hero flex justify-center items-center">

        <div class="hero-bg-image relative">

            <img src="/assets/images/shop.svg" alt="Cart Hero">

        </div>

        <div class="hero-content absolute">

            <h1 class="text-[48px] font-medium">
                Cart
            </h1>

            <nav aria-label="breadcrumb">
                <ol class="flex justify-center gap-4">
                    <li class="font-medium">Home</li>
                    <li>
                        <i class="fa-solid fa-angle-right"></i>
                    </li>
                    <li>Cart</li>
                </ol>
            </nav>

        </div>

    </section>

    <main class="
            max-w-[1440px]
            mx-auto
            px-4
            sm:px-6
            lg:px-8
            py-16">


        <section id="cart-empty-state" class="hidden">
        </section>

        <section id="cart-content" class="
                grid
                lg:grid-cols-[1fr_380px]
                gap-10
                items-start">

            <section aria-label="Shopping Cart" class="min-w-0">

                <div class="
                        grid
                        grid-cols-[110px_1fr_180px_140px_180px_60px]
                        items-center
                        bg-[#FAF3EA]
                        rounded-lg
                        px-6
                        py-5
                        font-semibold
                        text-[#3A3A3A]">

                    <span class="sr-only">Product Image</span>
                    <span>Product</span>
                    <span>Price</span>
                    <span>Quantity</span>
                    <span>Subtotal</span>
                    <span></span>

                </div>


                <ul id="cart-rows" class="
                        mt-2
                        flex
                        flex-col
                        divide-y
                        divide-[#F1F1F1]">
                </ul>

            </section>
            <aside id="cart-summary-root">
            </aside>
        </section>
    </main>

    <section id="featuresSection"></section>

    <footer id="footer-root"></footer>


    <script type="module" src="./cart.js">
    </script>

</body>

</html>
