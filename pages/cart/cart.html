<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="/styles/inspiration.css">
    <title>CART FILE</title>
</head>

<body>
    <header id="navbar-root" class="sticky top-0 z-50 flex items-center shadow-sm transition-all duration-300">
    </header>

    <section class="page-hero flex justify-center items-center">
        <div class="hero-bg-image relative">
            <img src="/assets/images/shop.svg" alt="shop-image">
        </div>
        <div class="hero-content absolute">
            <h1 class="text-[48px] font-medium">Shop</h1>
            <nav aria-label="breadcrumb" class="">
                <ol class="flex justify-between">
                    <li class="font-medium">Home</li>
                    <li><i class="fa-solid fa-angle-right"></i></li>
                    <li>Shop</li>
                </ol>
            </nav>
        </div>
    </section>

    <!-- Main Cart Content -->
    <main class="max-w-[1440px] mx-auto px-8 lg:px-16 py-16">
        <div id="cart-empty-state" class="hidden flex-col items-center justify-center gap-4 py-24 text-center">
            <i class="fa-solid fa-cart-shopping text-5xl text-gray-300"></i>
            <p class="text-gray-500">Your cart is empty.</p>
            <a href="/pages/shop.html"
                class="border border-dark rounded-md px-8 py-3 font-semibold text-dark hover:bg-gold hover:border-gold hover:text-white transition-colors">
                Continue Shopping
            </a>
        </div>

        <div id="cart-content" class="grid lg:grid-cols-3 gap-8">

            <!-- Cart Table -->
            <section aria-label="Cart items" class="lg:col-span-2">
                <div
                    class="grid grid-cols-[100px_1fr_1fr_1fr_40px] items-center gap-4 bg-[#FAF3EA] rounded-md px-6 py-4 font-semibold text-dark text-sm">
                    <span class="sr-only">Image</span>
                    <span>Product</span>
                    <span>Price</span>
                    <span>Quantity</span>
                    <span>Subtotal</span>
                </div>

                <ul id="cart-rows" class="flex flex-col divide-y divide-gray-100"></ul>
            </section>

            <!-- Cart Totals -->
            <aside aria-labelledby="cart-totals-heading" class="bg-[#FAF3EA] rounded-md p-8 h-fit">
                <h2 id="cart-totals-heading" class="text-2xl font-semibold text-dark mb-6">Cart Totals</h2>

                <div class="flex justify-between border-b border-gray-300 pb-4 mb-4">
                    <span class="font-medium text-dark">Subtotal</span>
                    <span id="cart-subtotal" class="text-gray-500">Rs. 0.00</span>
                </div>
                <div class="flex justify-between pb-6">
                    <span class="font-medium text-dark">Total</span>
                    <span id="cart-total" class="text-gold text-xl font-semibold">Rs. 0.00</span>
                </div>

                <a href="/pages/checkout.html" id="checkout-btn" class="block text-center border border-dark rounded-md py-4 font-semibold text-dark
                       hover:bg-gold hover:border-gold hover:text-white transition-colors
                       aria-disabled:opacity-50 aria-disabled:cursor-not-allowed aria-disabled:pointer-events-none">
                    Check Out
                </a>
            </aside>
        </div>
    </main>

    <div id="featuresSection"></div>

    <footer id="footer-root"></footer>
</body>

</html>
