<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="../styles/style.css">
        <link rel="stylesheet" href="/styles/inspiration.css">
        <title>Shop</title>
    </head>
    <body class="w-full h-screen">
        <header class="bg-white w-full h-[100px] flex items-center shadow-sm cursor-pointer transition duration-300">
            <div class="mx-auto px-4 max-w-[1286px] w-full flex justify-between items-center">

                <div class="flex items-center gap-2 hover:scale-105 transition duration-600">
                    <img src="/assets/images/logo.svg" alt="logo_image">
                    <p class="font-bold md:text-[34px] transition duration-300">Furniro</p>
                </div>

                <ul class="hidden md:flex items-center gap-13 list-none font-medium text-[16px] capitalize">
                    <li>
                        <a href="/home.html" class="relative group text-gray-700 transition duration-300 hover:text-black">
                            home
                            <span
                                class="absolute left-0 -bottom-1 w-0 h-0.5 bg-black transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </li>

                    <li>
                        <a href="/pages/shop.html" class="relative group text-gray-700 transition duration-300 hover:text-black">
                            shop
                            <span
                                class="absolute left-0 -bottom-1 w-0 h-0.5 bg-black transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </li>

                    <li>
                        <a href="#About" class="relative group text-gray-700 transition duration-300 hover:text-black">
                            about
                            <span
                                class="absolute left-0 -bottom-1 w-0 h-0.5 bg-black transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </li>

                    <li>
                        <a href="#contact" class="relative group text-gray-700 transition duration-300 hover:text-black">
                            contact
                            <span
                                class="absolute left-0 -bottom-1 w-0 h-0.5 bg-black transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </li>
                </ul>

                <ul class="flex list-none items-center gap-8 text-xl">
                    <li>
                        <a href="#" aria-label="user"
                            class="p-2 rounded-full transition duration-300 hover:bg-gray-200 hover:scale-110">
                            <i class="fa-solid fa-user"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#" aria-label="search"
                            class="p-2 rounded-full transition duration-300 hover:bg-gray-200 hover:scale-110">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#" aria-label="favourite"
                            class="p-2 rounded-full transition duration-300 hover:bg-gray-200 hover:scale-110">
                            <i class="fa-regular fa-heart"></i>
                        </a>
                    </li>

                    <li>
                        <a href="#" aria-label="cart"
                            class="p-2 rounded-full transition duration-300 hover:bg-gray-200 hover:scale-110">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </li>

                </ul>
            </div>
        </header>

        <section class="page-hero">
            <div class="hero-bg-image"></div>
            <div class="hero-content">
                <h1>Shop</h1>
                <nav aria-label="breadcrumb">
                    <ol>
                        <li></li>
                    </ol>
                </nav>
            </div>
        </section>

        <section class="shop-toolbar">
            <div class="toolbar-left">
                <button>Filter</button>
                <div>View toggles</div>
            </div>
            <p class="result-count">Showing 1-16 of 32 results</p>
            <div class="toolbar-right">
                <label for="">Show</label>
                <label for="">Sort by</label>
            </div>
        </section>

        <main class="product-grid-section">
            <div class="product-grid">
                <article class="product-cart">
                    <div class="card-image-wrapper">
                        <img src="" alt="">
                        <span></span>
                        <div>
                            <button>Add to Cart</button>
                            <div class="card-actions">
                                share-compare-like
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="product-name"></h3>
                        <p class="product-subtitle"></p>
                        <div class="product-price">
                            <span class="price-current"></span>
                            <span class="price-original"></span> <!-- Optional -->
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <nav class="pagination" aria-label="Shop pages">
            <ul>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </nav>

        <section class="trust-strip">
            <div class="trust-grid">
                <div class="trust-item">
                    <img src="" alt="">
                    <div>
                        <h4></h4>
                        <p></p>
                    </div>
                </div>
                <div class="trust-item">
                    <img src="" alt="">
                    <div>
                        <h4></h4>
                        <p></p>
                    </div>
                </div>
                <div class="trust-item">
                    <img src="" alt="">
                    <div>
                        <h4></h4>
                        <p></p>
                    </div>
                </div>
                <div class="trust-item">
                    <img src="" alt="">
                    <div>
                        <h4></h4>
                        <p></p>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
