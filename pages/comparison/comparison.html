<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Comparison | Furniro</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../../styles/style.css" />
</head>

<body class="bg-white">

    <!-- Navbar -->

    <header
        id="navbar-root"
        class="sticky top-0 z-50 shadow-sm">
    </header>

    <!-- Hero -->

    <section class="page-hero flex justify-center items-center">

        <div class="hero-bg-image relative">

            <img
                src="/assets/images/shop.svg"
                alt="Comparison Banner" />

        </div>

        <div class="hero-content absolute">

            <h1 class="text-[48px] font-medium">
                Product Comparison
            </h1>

            <nav aria-label="Breadcrumb">

                <ol class="flex items-center justify-center gap-2">

                    <li class="font-medium">
                        Home
                    </li>

                    <li>
                        <i class="fa-solid fa-angle-right"></i>
                    </li>

                    <li>
                        Comparison
                    </li>

                </ol>

            </nav>

        </div>

    </section>

    <!-- Main -->

    <main
        class="max-w-[1286px] mx-auto px-4 sm:px-6 lg:px-8 py-16"
        aria-label="Product Comparison">

        <!-- Promo + Cards + Selector -->

        <section
            id="comparison-section"
            class="mb-16">
        </section>

        <!-- Comparison Table -->

        <section
            id="comparison-table"
            class="w-full">
        </section>

    </main>

    <!-- Features -->

    <section id="featuresSection"></section>

    <!-- Footer -->

    <footer id="footer-root"></footer>

    <script
        type="module"
        src="./productComparison.js">
    </script>

</body>

</html>
