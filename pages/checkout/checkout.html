<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../../styles/style.css">

    <title>Checkout — Furniro</title>

</head>

<body class="bg-white">


    <header id="navbar-root" class="sticky top-0 z-50">
    </header>


    <section class="page-hero flex justify-center items-center" aria-labelledby="checkout-page-title">

        <div class="hero-bg-image relative">

            <img src="/assets/images/shop.svg" alt="Checkout Hero">

        </div>

        <div class="hero-content absolute">

            <h1 id="checkout-page-title" class="text-[48px] font-medium">

                Checkout

            </h1>

            <nav aria-label="Breadcrumb">

                <ol class="flex justify-center gap-4">

                    <li>

                        <a href="/pages/home/home.html">

                            Home

                        </a>

                    </li>

                    <li aria-hidden="true">

                        <i class="fa-solid fa-angle-right"></i>

                    </li>

                    <li aria-current="page">

                        Checkout

                    </li>

                </ol>

            </nav>

        </div>

    </section>

    <main class="
            max-w-[1440px]
            mx-auto
            px-4
            sm:px-6
            lg:px-8
            py-20
        ">

        <section id="checkout-empty-state" class="hidden" aria-live="polite">
        </section>

        <section id="checkout-content" class="
                grid
                lg:grid-cols-[minmax(0,1fr)_420px]
                gap-20
                items-start
            ">


            <section id="billing-form-root" aria-labelledby="billing-details-title">

            </section>

            <aside id="checkout-sidebar-root" aria-label="Checkout Summary">

            </aside>

        </section>

    </main>

    <section id="featuresSection">
    </section>

    <footer id="footer-root">
    </footer>

    <script type="module" src="./checkout.js">
    </script>

</body>

</html>
