<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../../styles/style.css">

    <title>Checkout — Furniro</title>

</head>

<body class="bg-white">

    <!-- Navbar -->

    <header id="navbar-root" class="sticky top-0 z-50">
    </header>


    <!-- Hero -->

    <section class="page-hero flex justify-center items-center">

        <div class="hero-bg-image relative">

            <img src="/assets/images/shop.svg" alt="Checkout Hero">

        </div>

        <div class="hero-content absolute">

            <h1 class="text-[48px] font-medium">

                Checkout

            </h1>

            <nav aria-label="breadcrumb">

                <ol class="flex justify-center gap-4">

                    <li>Home</li>

                    <li>

                        <i class="fa-solid fa-angle-right"></i>

                    </li>

                    <li>Checkout</li>

                </ol>

            </nav>

        </div>

    </section>


    <!-- Main -->

    <main class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-16">


        <!-- Empty Cart -->

        <section id="checkout-empty-state" class="hidden">
        </section>


        <!-- Checkout Content -->

        <section id="checkout-content" class="grid lg:grid-cols-[1fr_420px] gap-20 items-start">


            <!-- Billing -->

            <section id="billing-form-root" aria-labelledby="billing-form-title">
            </section>


            <!-- Sidebar -->

            <aside id="checkout-sidebar-root">
            </aside>


        </section>

    </main>


    <!-- Features -->

    <section id="featuresSection">
    </section>


    <!-- Footer -->

    <footer id="footer-root">
    </footer>


    <script type="module" src="./checkout.js">
    </script>

</body>

</html>
