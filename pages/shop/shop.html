<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../../styles/style.css">
    <title>Shop</title>
</head>

<body class="w-full min-h-screen">

    <header id="navbar-root" class="sticky top-0 z-50 flex items-center shadow-sm transition-all duration-300">
    </header>

    <section class="page-hero flex justify-center items-center">
        <div class="hero-bg-image relative">
            <img src="/assets/images/shop.svg" alt="shop-image">
        </div>
        <div class="hero-content absolute">
            <h1 class="text-[48px] font-medium">Shop</h1>
            <nav aria-label="breadcrumb" class="">
                <ol class="flex justify-between">
                    <li class="font-medium">Home</li>
                    <li><i class="fa-solid fa-angle-right"></i></li>
                    <li>Shop</li>
                </ol>
            </nav>
        </div>
    </section>

    <section class="shop-toolbar bg-[#F9F1E7] px-8 py-6">

        <div class="container mx-auto flex items-center justify-between flex-wrap gap-6">

            <div class="flex items-center gap-6">
                <button id="filterBtn"
                    class="flex items-center gap-2 text-sm font-medium hover:opacity-70 transition cursor-pointer">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Filter</span>
                </button>

                <div class="flex items-center gap-4 text-lg">
                    <button id="gridView" class="hover:opacity-70 transition cursor-pointer">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                    <button id="listView" class="hover:opacity-70 transition cursor-pointer">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>

                <div class="pl-6 border-l border-gray-400">
                    <p class="text-sm text-gray-700">
                        Showing 1-16 of 32 results
                    </p>
                </div>

            </div>

            <div class="flex items-center gap-8">
                <div class="flex items-center gap-4">
                    <label for="showItems" class="text-sm font-medium">Show</label>

                    <select id="showItems"
                        class="w-16 h-12 bg-white text-center outline-none border border-gray-200 appearance-none">
                        <option>16</option>
                        <option>32</option>
                        <option>All</option>
                    </select>
                </div>


                <div class="flex items-center gap-4">
                    <label for="sortItems" class="text-sm font-medium">Sort by</label>

                    <select id="sortItems"
                        class="w-44 h-12 bg-white px-3 outline-none border border-gray-200 appearance-none">
                        <option>Default</option>
                        <option>Price</option>
                        <option>Name</option>
                        <option>Newest</option>
                    </select>
                </div>

            </div>
        </div>
    </section>

    <section class="container mx-auto py-16">
        <div id="shopContainer"></div>
    </section>

    <nav class="pagination mt-16" aria-label="Shop pages">
        <ul id="paginationList" class="flex items-center gap-6"></ul>
    </nav>

    <div id="featuresSection"></div>

    <footer id="footer-root"></footer>

    <script type="module" src="./shop.js"></script>
</body>

</html>
